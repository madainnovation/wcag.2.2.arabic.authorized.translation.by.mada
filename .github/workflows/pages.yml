name: Publish Arabic WCAG 2.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the translation
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install document tools
        run: python -m pip install -r requirements.txt
      - name: Build and check the translation
        run: |
          python scripts/build.py
          python scripts/validate.py
          python scripts/check_layout.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the HTML preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: wcag22-ar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the HTML preview
        id: deployment
        uses: actions/deploy-pages@v4
